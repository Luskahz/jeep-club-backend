# Desenvolvimento local: MySQL no Docker, Spring Boot no IntelliJ e Next.js com npm run dev.
# Execute este arquivo isoladamente, com -f compose.local.yaml (veja deploy/LOCAL.md).
# O nome do projeto separa os containers e volumes locais da stack da VPS.
name: jeep-club-local

services:
  mysql:
    # Mesma linha de versão utilizada pela VPS.
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jeepclub
      MYSQL_USER: jeepclub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD em .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD em .env.local}
    ports:
      # Acesso pela máquina local; 3307 evita o MySQL normalmente instalado na porta 3306.
      - '127.0.0.1:${MYSQL_LOCAL_PORT:-3307}:3306'
    volumes:
      # Dados persistem ao parar ou remover o container, sem a opção --volumes.
      - mysql-local-data:/var/lib/mysql
    healthcheck:
      # Consulta real com o usuário da aplicação; $$ mantém a variável dentro do container.
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u jeepclub -D jeepclub -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  mysql-local-data:
