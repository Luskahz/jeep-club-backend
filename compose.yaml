name: jeep-club
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jeepclub
      MYSQL_USER: jeepclub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u jeepclub -D jeepclub -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  backend:
    image: ${BACKEND_IMAGE:-jeep-club-backend:local}
    build: .
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx2g
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jeepclub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: jeepclub
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?Set SECURITY_JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      STORAGE_LOCAL_ROOT_DIRECTORY: /app/storage
      APP_SERVER_BASE_URL: ${APP_SERVER_BASE_URL:-http://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:-true}
      SECURITY_BOOTSTRAP_ADMIN_ENABLED: ${SECURITY_BOOTSTRAP_ADMIN_ENABLED:-false}
      SECURITY_BOOTSTRAP_ADMIN_NAME: ${ADMIN_NAME:-Administrador Teste}
      SECURITY_BOOTSTRAP_ADMIN_BIRTH_DATE: ${ADMIN_BIRTH_DATE:-2000-01-01}
      SECURITY_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost.com}
      SECURITY_BOOTSTRAP_ADMIN_CPF: ${ADMIN_CPF:-12345678909}
      SECURITY_BOOTSTRAP_ADMIN_RG: ${ADMIN_RG:-123456789}
      SECURITY_BOOTSTRAP_ADMIN_PHONE_NUMBER: ${ADMIN_PHONE:-12999999999}
      SECURITY_BOOTSTRAP_ADMIN_ROLE_NAME: ADMIN
      SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_PASSWORD_RESET_URL: ${APP_PASSWORD_RESET_URL:-http://localhost:3000/password-recovery/reset}
      APP_MEMBERSHIP_ACTIVATION_URL: ${APP_MEMBERSHIP_ACTIVATION_URL:-http://localhost:3000/membership/activate}
    volumes:
      - uploads:/app/storage
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/v3/api-docs']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  mysql-data:
  uploads:
