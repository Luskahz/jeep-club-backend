# ========= SERVER =========
spring.application.name=backend-test

# ========= H2 DATABASE / JPA =========
spring.datasource.url=jdbc:h2:mem:jeep_club_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========= SECURITY =========
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.access-token-expiration-seconds=3600
security.jwt.issuer=issuerProvisorio

# ========= AUTH/TTL =========
security.auth.refresh-token-ttl=7d
security.auth.session-ttl=7d
security.auth.password-change-request-ttl=7d
app.user-facing.password-reset-url=http://localhost:3000/password-recovery/reset
app.user-facing.membership-activation-url=http://localhost:3000/membership/activate

# ========= BOOTSTRAP/INICIAL =========
security.bootstrap.admin.enabled=false
security.bootstrap.admin.role-name=ROOT
