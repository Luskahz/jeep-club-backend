# ========= SERVER =========
server.port=${PORT:8080}
app.server.base-url=${APP_SERVER_BASE_URL:http://localhost:${server.port}}
spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========= DB / JPA =========
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# ========= SECURITY / JWT =========
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-token-expiration-seconds=${SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${SECURITY_JWT_ISSUER:jeep-club-backend}

# ========= AUTH/TTL =========
security.auth.refresh-token-ttl=${SECURITY_AUTH_REFRESH_TOKEN_TTL:7d}
security.auth.session-ttl=${SECURITY_AUTH_SESSION_TTL:7d}
security.auth.password-recovery-request-ttl=${SECURITY_AUTH_PASSWORD_RECOVERY_REQUEST_TTL:7d}
security.auth.password-change-challenge-ttl=${SECURITY_AUTH_PASSWORD_CHANGE_CHALLENGE_TTL:10m}
membership.activation-token-ttl=${MEMBERSHIP_ACTIVATION_TOKEN_TTL:72h}

# ========= BOOTSTRAP/INICIAL =========
security.bootstrap.admin.enabled=${SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap.admin.name=${SECURITY_BOOTSTRAP_ADMIN_NAME:}
security.bootstrap.admin.birth-date=${SECURITY_BOOTSTRAP_ADMIN_BIRTH_DATE:}
security.bootstrap.admin.email=${SECURITY_BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap.admin.cpf=${SECURITY_BOOTSTRAP_ADMIN_CPF:}
security.bootstrap.admin.rg=${SECURITY_BOOTSTRAP_ADMIN_RG:}
security.bootstrap.admin.password=${SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
security.bootstrap.admin.phone-number=${SECURITY_BOOTSTRAP_ADMIN_PHONE_NUMBER:}
security.bootstrap.admin.role-name=${SECURITY_BOOTSTRAP_ADMIN_ROLE_NAME:ADMIN}

# ========= BILLING / RECEIPTS STORAGE =========
billing.receipts.storage.root-directory=storage/billing/payment-receipts
billing.receipts.storage.public-base-url=${app.server.base-url}/billing/payment-receipts
billing.receipts.storage.max-file-size=10MB

billing.receipts.storage.allowed-content-types[0]=application/pdf
billing.receipts.storage.allowed-content-types[1]=image/jpeg
billing.receipts.storage.allowed-content-types[2]=image/png
billing.receipts.storage.allowed-content-types[3]=image/webp

billing.receipts.storage.allowed-extensions[0]=pdf
billing.receipts.storage.allowed-extensions[1]=jpg
billing.receipts.storage.allowed-extensions[2]=jpeg
billing.receipts.storage.allowed-extensions[3]=png
billing.receipts.storage.allowed-extensions[4]=webp


