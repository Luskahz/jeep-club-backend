# ========= SERVER =========
server.port=${PORT:8080}
app.server.base-url=${APP_SERVER_BASE_URL:http://localhost:${server.port}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
spring.application.name=${SPRING_APPLICATION_NAME:jeep-club-backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========= IMPORT JWT SECRETS =========
# Importa as chaves do arquivo separado (conforme passo 4 da documentação)
spring.config.import=optional:classpath:jwt-secrets.properties

# ========= PAGINATION =========
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# ========= DATABASE / JPA =========
# Nome do banco atualizado para "jeepclub" de acordo com a documentação
spring.datasource.url=jdbc:mysql://localhost:3306/jeepclub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America%2FSao_Paulo
spring.datasource.username=root
spring.datasource.password=aluno
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# ========= FLYWAY =========
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# ========= SECURITY / JWT =========
security.jwt.access-token-expiration-seconds=${SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${SECURITY_JWT_ISSUER:jeep-club-backend}

# ========= AUTH / TTL =========
security.auth.refresh-token-ttl=${SECURITY_AUTH_REFRESH_TOKEN_TTL:7d}
security.auth.session-ttl=${SECURITY_AUTH_SESSION_TTL:7d}
security.auth.password-recovery-request-ttl=${SECURITY_AUTH_PASSWORD_RECOVERY_REQUEST_TTL:7d}
security.auth.password-change-challenge-ttl=${SECURITY_AUTH_PASSWORD_CHANGE_CHALLENGE_TTL:10m}

membership.activation-token-ttl=${MEMBERSHIP_ACTIVATION_TOKEN_TTL:72h}

# ========= BOOTSTRAP / ADMINISTRADOR LOCAL =========
security.bootstrap.admin.enabled=true
security.bootstrap.admin.name=Administrador Local
security.bootstrap.admin.birth-date=2000-01-01
security.bootstrap.admin.email=admin@localhost.com
security.bootstrap.admin.cpf=12345678909
security.bootstrap.admin.rg=123456789
security.bootstrap.admin.password=teste123
security.bootstrap.admin.phone-number=12999999999
security.bootstrap.admin.role-name=ADMIN

# ========= BILLING / RECEIPTS STORAGE =========
billing.receipts.storage.root-directory=${BILLING_RECEIPTS_STORAGE_ROOT_DIRECTORY:storage/billing/payment-receipts}
billing.receipts.storage.public-base-url=${BILLING_RECEIPTS_STORAGE_PUBLIC_BASE_URL:${app.server.base-url}/billing/payment-receipts}
billing.receipts.storage.max-file-size=${BILLING_RECEIPTS_STORAGE_MAX_FILE_SIZE:10MB}

billing.receipts.storage.allowed-content-types[0]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_0:application/pdf}
billing.receipts.storage.allowed-content-types[1]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_1:image/jpeg}
billing.receipts.storage.allowed-content-types[2]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_2:image/png}
billing.receipts.storage.allowed-content-types[3]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_3:image/webp}

billing.receipts.storage.allowed-extensions[0]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_0:pdf}
billing.receipts.storage.allowed-extensions[1]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_1:jpg}
billing.receipts.storage.allowed-extensions[2]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_2:jpeg}
billing.receipts.storage.allowed-extensions[3]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_3:png}
billing.receipts.storage.allowed-extensions[4]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_4:webp}