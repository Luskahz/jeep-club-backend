# ========= SERVER =========
server.port=${PORT:8080}
app.server.base-url=${APP_SERVER_BASE_URL:http://localhost:${server.port}}
app.user-facing.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:3000/password-recovery/reset}
app.user-facing.membership-activation-url=${APP_MEMBERSHIP_ACTIVATION_URL:http://localhost:3000/membership/activate}
app.mail.from=${APP_MAIL_FROM:}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
spring.application.name=${SPRING_APPLICATION_NAME:jeep-club-backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ========= PAGINATION =========
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# ========= DB / JPA =========
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Contexto transversal anexado automaticamente aos logs emitidos durante requests HTTP.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:--} userId=%X{userId:--} userName="%X{userName:--}" device=%X{device:--} - %msg%n

# Dados de requisição/resposta e bind parameters podem conter conteúdo médico.
# Estes loggers permanecem protegidos mesmo quando o root logger usa DEBUG/TRACE.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.jdbc.BasicBinder=OFF

# ========= FLYWAY =========
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# ========= SECURITY / JWT =========
security.jwt.access-token-expiration-seconds=${SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${SECURITY_JWT_ISSUER:jeep-club-backend}

# ========= AUTH / TTL =========
security.auth.refresh-token-ttl=${SECURITY_AUTH_REFRESH_TOKEN_TTL:7d}
security.auth.session-ttl=${SECURITY_AUTH_SESSION_TTL:7d}
security.auth.password-recovery-request-ttl=${SECURITY_AUTH_PASSWORD_RECOVERY_REQUEST_TTL:7d}
security.auth.password-change-challenge-ttl=${SECURITY_AUTH_PASSWORD_CHANGE_CHALLENGE_TTL:10m}

membership.activation-token-ttl=${MEMBERSHIP_ACTIVATION_TOKEN_TTL:72h}

# ========= SMTP =========
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:0}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}

# ========= GLOBAL FILE STORAGE =========
storage.provider=${STORAGE_PROVIDER:local}
storage.local.root-directory=${STORAGE_LOCAL_ROOT_DIRECTORY:./storage}

# ========= BOOTSTRAP =========
security.bootstrap.admin.enabled=${SECURITY_BOOTSTRAP_ADMIN_ENABLED:true}

# ========= BILLING / RECEIPT VALIDATION =========
billing.receipts.validation.max-file-size=${BILLING_RECEIPTS_VALIDATION_MAX_FILE_SIZE:10MB}

billing.receipts.validation.allowed-content-types[0]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_0:application/pdf}
billing.receipts.validation.allowed-content-types[1]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_1:image/jpeg}
billing.receipts.validation.allowed-content-types[2]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_2:image/png}
billing.receipts.validation.allowed-content-types[3]=${BILLING_RECEIPTS_ALLOWED_CONTENT_TYPE_3:image/webp}

billing.receipts.validation.allowed-extensions[0]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_0:pdf}
billing.receipts.validation.allowed-extensions[1]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_1:jpg}
billing.receipts.validation.allowed-extensions[2]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_2:jpeg}
billing.receipts.validation.allowed-extensions[3]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_3:png}
billing.receipts.validation.allowed-extensions[4]=${BILLING_RECEIPTS_ALLOWED_EXTENSION_4:webp}
